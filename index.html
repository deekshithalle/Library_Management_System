<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>📚 Library Management System</h1>
    </header>

    <div class="container">

        <!-- Dashboard -->
        <section class="dashboard">

            <div class="card">
                <h2 id="totalBooks">0</h2>
                <p>Total Books</p>
            </div>

            <div class="card">
                <h2 id="issuedBooks">0</h2>
                <p>Issued Books</p>
            </div>

            <div class="card">
                <h2 id="availableBooks">0</h2>
                <p>Available Books</p>
            </div>

        </section>

        <!-- Add Book -->
        <section class="add-book">

            <h2>Add Book</h2>

            <input
                type="text"
                id="bookName"
                placeholder="Book Name">

            <input
                type="text"
                id="author"
                placeholder="Author Name">

            <input
                type="number"
                id="quantity"
                placeholder="Quantity">

            <button onclick="addBook()">
                Add Book
            </button>

        </section>

        <!-- Book List -->

        <section class="book-list">

            <h2>Available Books</h2>

            <table>

                <thead>

                    <tr>

                        <th>ID</th>
                        <th>Book</th>
                        <th>Author</th>
                        <th>Qty</th>
                        <th>Action</th>

                    </tr>

                </thead>

                <tbody id="bookTable">

                </tbody>

            </table>

        </section>

    </div>

<script src="script.js"></script>

</body>
</html>
